<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ดลใจ | QR Generator</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1818;
        background: #efefef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 420px minmax(0, 1fr);
      }

      .controls {
        padding: 34px;
        background: #fff;
        border-right: 1px solid #ddd;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #666;
        font-size: 13px;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 26px;
        font-size: 32px;
        line-height: 1.3;
      }

      label {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
        color: #555;
        font-size: 13px;
        font-weight: 750;
      }

      input,
      select {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        color: #1a1818;
        background: #fff;
        font: inherit;
      }

      input[type="color"] {
        padding: 4px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
      }

      .check {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #1a1818;
      }

      .check input {
        width: 18px;
        height: 18px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 22px;
      }

      button,
      a.download {
        height: 44px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 7px;
        color: #fff;
        background: #1a1818;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      a.download {
        background: #444;
      }

      .message {
        min-height: 20px;
        color: #a33a35;
        line-height: 1.5;
      }

      .preview {
        display: grid;
        place-items: center;
        padding: 36px;
      }

      .preview canvas {
        width: 100%;
        max-width: 560px;
        height: auto;
        aspect-ratio: 1;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.08);
      }

      .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; color: inherit; text-decoration: none; }
      .brand img { width: 88px; height: 88px; object-fit: contain; border-radius: 4px; }
      .brand strong { display: block; font-size: 24px; }
      .brand span { color: #666; font-size: 14px; }
      input::placeholder { color: #929292; opacity: 1; }
      input, select, .row > *, .actions > * { min-width: 0; }
      input[type="file"] { padding: 10px; font-size: 12px; }
      input[type="checkbox"] { accent-color: #1a1818; }
      :focus-visible { outline: 2px solid #555; outline-offset: 3px; }
      a.download[aria-disabled="true"] { opacity: 0.4; cursor: not-allowed; }
      .preview { position: relative; }
      .empty { position: absolute; color: #777; font-size: 16px; pointer-events: none; }
      [hidden] { display: none !important; }
      .styles { border: 0; padding: 18px 0; margin: 0; border-top: 1px solid #e5e5e5; min-width: 0; }
      .styles legend { padding: 0 0 8px; font-size: 13px; font-weight: 750; }
      .style-options { display: flex; flex-wrap: wrap; gap: 8px; }
      .style-option { margin: 0; position: relative; cursor: pointer; }
      .style-option input { position: absolute; opacity: 0; width: 48px; height: 48px; margin: 0; cursor: pointer; }
      .style-option canvas { width: 48px; height: 48px; border: 1px solid #ddd; border-radius: 6px; padding: 7px; }
      .style-option input:checked + canvas { border: 2px solid #1a1818; background: #eee; padding: 6px; }
      .style-option input:focus-visible + canvas { outline: 2px solid #555; outline-offset: 3px; }
      .preview { align-self: start; position: sticky; top: 0; min-height: 100vh; }

      @media (min-width: 851px) {
        .app { grid-template-columns: 400px minmax(0, 1fr); min-height: 100dvh; }
        .controls { padding: 16px 24px; }
        .brand { gap: 12px; margin-bottom: 8px; }
        .brand img { width: 48px; height: 48px; }
        .brand strong { font-size: 20px; }
        .brand span { font-size: 12px; }
        .eyebrow { display: none; }
        h1 { font-size: 24px; margin-bottom: 12px; }
        label { gap: 4px; margin-bottom: 10px; }
        input, select { height: 36px; }
        input[type="file"] { padding: 6px 8px; }
        .styles { padding: 5px 0 8px; }
        .styles legend { padding-bottom: 3px; }
        .style-options { gap: 7px; }
        .style-option { margin: 0; }
        .style-option input, .style-option canvas { width: 38px; height: 38px; }
        .style-option canvas { padding: 5px; }
        .style-option input:checked + canvas { padding: 4px; }
        .check { margin-top: 4px; margin-bottom: 8px; }
        .actions { margin-top: 10px; }
        button, a.download { height: 38px; font-size: 14px; }
        .message { min-height: 0; margin: 6px 0 0; font-size: 12px; }
        .message:empty { display: none; }
        .preview { min-height: 100dvh; padding: 24px; }
        .preview canvas { max-width: min(560px, calc(100dvh - 48px)); }
      }

      @media (min-width: 851px) and (max-height: 650px) {
        .controls { padding-top: 10px; padding-bottom: 10px; }
        h1 { margin-bottom: 8px; }
        label { margin-bottom: 6px; }
        .styles { padding-top: 2px; padding-bottom: 4px; }
        .style-option { margin: 0; }
        .actions { margin-top: 6px; }
      }
      @media (max-width: 850px) {
        .brand { gap: 12px; margin-bottom: 12px; }
        .brand img { width: 52px; height: 52px; }
        .brand strong { font-size: 20px; }
        .brand span { font-size: 12px; }
        .eyebrow { display: none; }
        h1 { font-size: 26px; margin-bottom: 20px; }
        .app {
          grid-template-columns: 1fr;
        }

        .controls {
          border-right: 0;
          border-bottom: 1px solid #ddd;
        }
        .preview { position: relative; min-height: 0; }
      }
      @media (max-width: 440px) {
        .controls { padding: 24px 20px; }
        .preview { padding: 24px 20px; }
        .actions { font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="controls">
        <a class="brand" href="https://donjai.me/" target="_blank" rel="noopener noreferrer">
          <img src="donjai-logo.jpg" alt="โลโก้ดลใจ" width="88" height="88" />
          <div><strong>ดลใจ</strong><span>donjai.me</span></div>
        </a>
        <p class="eyebrow">QR Generator</p>
        <h1>สร้าง QR Code</h1>

        <label>
          URL หรือข้อความ
          <input id="value" placeholder="ใส่ URL ที่นี่ เช่น https://donjai.me/" autocomplete="off" />
        </label>

        <div class="row">
          <label>
            สี QR
            <input id="qrColor" type="color" value="#1a1818" />
          </label>
          <label>
            สีพื้นหลัง
            <input id="bgColor" type="color" value="#ffffff" />
          </label>
          <label>
            ขนาด PNG
            <select id="size">
              <option value="800">800 px</option>
              <option value="1200" selected>1200 px</option>
              <option value="1600">1600 px</option>
              <option value="2000">2000 px</option>
            </select>
          </label>
        </div>

        <fieldset class="styles"><legend>รูปแบบลาย QR</legend><div class="style-options" id="pattern-options"></div></fieldset>
        <fieldset class="styles"><legend>กรอบมุม</legend><div class="style-options" id="frame-options"></div></fieldset>
        <fieldset class="styles"><legend>จุดกลางมุม</legend><div class="style-options" id="center-options"></div></fieldset>

        <label class="check">
          <input id="useLogo" type="checkbox" />
          ใส่โลโก้ตรงกลาง QR
        </label>

        <label>
          เลือกโลโก้
          <input id="logo" type="file" accept="image/png,image/jpeg,image/webp" />
        </label>

        <div class="actions">
          <button id="generate">สร้าง Preview</button>
          <a id="download" class="download" download="qr-code.png">ดาวน์โหลด PNG</a>
        </div>
        <p id="message" class="message" role="status"></p>
      </section>

      <section class="preview">
        <canvas id="canvas" width="1200" height="1200" aria-label="QR Preview"></canvas>
        <p id="empty" class="empty">ตัวอย่าง QR Code</p>
      </section>
    </main>

    <script src="qrcode.js"></script>
    <script>
      const valueInput = document.querySelector("#value");
      const qrColor = document.querySelector("#qrColor");
      const bgColor = document.querySelector("#bgColor");
      const sizeInput = document.querySelector("#size");
      const useLogo = document.querySelector("#useLogo");
      const logoInput = document.querySelector("#logo");
      const generateBtn = document.querySelector("#generate");
      const canvas = document.querySelector("#canvas");
      const download = document.querySelector("#download");
      const message = document.querySelector("#message");
      const ctx = canvas.getContext("2d");
      const empty = document.querySelector("#empty");

      let logoImage = null;
      const styles = { pattern: "square", frame: "square", center: "square" };

      function shape(context, x, y, size, style, color) {
        context.fillStyle = color;
        context.beginPath();
        if (style === "dots") {
          context.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
        } else {
          const radius = style === "rounded" ? size * 0.28 : style === "leaf" ? [size * 0.5, 0, size * 0.5, 0] : 0;
          context.roundRect(x, y, size, size, radius);
        }
        context.fill();
      }

      function moduleShape(context, x, y, size, style, color, neighbors = {}) {
        if (style === "horizontal" || style === "vertical" || style === "connected") {
          const horizontal = style !== "vertical";
          const vertical = style !== "horizontal";
          const r = size * 0.5;
          const radii = [
            (horizontal && neighbors.left) || (vertical && neighbors.up) ? 0 : r,
            (horizontal && neighbors.right) || (vertical && neighbors.up) ? 0 : r,
            (horizontal && neighbors.right) || (vertical && neighbors.down) ? 0 : r,
            (horizontal && neighbors.left) || (vertical && neighbors.down) ? 0 : r,
          ];
          context.fillStyle = color;
          context.beginPath();
          context.roundRect(x, y, size, size, radii);
          context.fill();
        } else shape(context, x, y, size, style, color);
      }

      function eye(context, x, y, cell, frame, center, foreground, background) {
        shape(context, x, y, 7 * cell, frame, foreground);
        shape(context, x + cell, y + cell, 5 * cell, frame, background);
        shape(context, x + 2 * cell, y + 2 * cell, 3 * cell, center, foreground);
      }

      const choices = {
        pattern: [["square", "สี่เหลี่ยม"], ["rounded", "มุมมน"], ["dots", "จุดวงกลม"], ["connected", "โค้งเชื่อมกัน"], ["horizontal", "เส้นแนวนอน"], ["vertical", "เส้นแนวตั้ง"]],
        frame: [["square", "สี่เหลี่ยม"], ["rounded", "มุมมน"], ["dots", "วงกลม"], ["leaf", "ใบไม้"]],
        center: [["square", "สี่เหลี่ยม"], ["rounded", "มุมมน"], ["dots", "วงกลม"], ["leaf", "ใบไม้"]],
      };
      const sample = ["110101", "011110", "110011", "101101", "111010", "010111"];
      for (const [group, options] of Object.entries(choices)) {
        for (const [value, label] of options) {
          const item = document.createElement("label");
          item.className = "style-option";
          item.title = label;
          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = group;
          radio.value = value;
          radio.checked = value === styles[group];
          radio.setAttribute("aria-label", label);
          const icon = document.createElement("canvas");
          icon.width = icon.height = 84;
          icon.setAttribute("aria-hidden", "true");
          const c = icon.getContext("2d");
          if (group === "pattern") {
            const dark = (r, col) => sample[r]?.[col] === "1";
            sample.forEach((line, r) => [...line].forEach((bit, col) => {
              if (bit === "1") moduleShape(c, col * 14, r * 14, 14, value, "#1a1818", {left: dark(r,col-1), right: dark(r,col+1), up: dark(r-1,col), down: dark(r+1,col)});
            }));
          } else if (group === "frame") {
            shape(c, 0, 0, 84, value, "#1a1818");
            shape(c, 16, 16, 52, value, "#fff");
          } else shape(c, 7, 7, 70, value, "#1a1818");
          radio.addEventListener("change", () => { styles[group] = value; generate(); });
          item.append(radio, icon);
          document.querySelector(`#${group}-options`).append(item);
        }
      }

      function loadLogo() {
        const file = logoInput.files && logoInput.files[0];
        logoImage = null;
        if (!file) {
          generate();
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            logoImage = img;
            useLogo.checked = true;
            generate();
          };
          img.onerror = () => {
            message.textContent = "อ่านไฟล์โลโก้ไม่ได้";
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      function drawRoundedRect(x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = Math.max(2, width / 90);
          ctx.stroke();
        }
      }

      function drawLogo(size) {
        if (!useLogo.checked || !logoImage) return;
        const maxLogo = size * 0.2;
        const scale = Math.min(maxLogo / logoImage.width, maxLogo / logoImage.height);
        const logoW = logoImage.width * scale;
        const logoH = logoImage.height * scale;
        const pad = Math.max(18, size / 80);
        const plate = Math.max(logoW, logoH) + pad * 2;
        const x = (size - plate) / 2;
        const y = (size - plate) / 2;
        drawRoundedRect(x, y, plate, plate, Math.max(22, plate / 7), bgColor.value, "#e6e6e6");
        ctx.drawImage(logoImage, (size - logoW) / 2, (size - logoH) / 2, logoW, logoH);
      }

      function generate() {
        message.textContent = "";
        download.removeAttribute("href");
        download.setAttribute("aria-disabled", "true");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        empty.hidden = false;
        const text = valueInput.value.trim();
        if (!text) {
          return;
        }

        try {
          const size = Number(sizeInput.value);
          canvas.width = size;
          canvas.height = size;

          const qr = qrcode(0, "H");
          qr.addData(text, "Byte");
          qr.make();

          const count = qr.getModuleCount();
          const quietZone = 4;
          const total = count + quietZone * 2;
          const cell = Math.floor(size / total);
          const offset = Math.floor((size - cell * count) / 2);

          ctx.fillStyle = bgColor.value;
          ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = qrColor.value;

          for (let row = 0; row < count; row += 1) {
            for (let col = 0; col < count; col += 1) {
              // Finder eyes are rendered separately, leaving their separators intact.
              if ((row < 7 && col < 7) || (row < 7 && col >= count - 7) || (row >= count - 7 && col < 7)) continue;
              if (qr.isDark(row, col)) {
                const dark = (r, c) => r >= 0 && c >= 0 && r < count && c < count && qr.isDark(r, c);
                moduleShape(ctx, offset + col * cell, offset + row * cell, cell, styles.pattern, qrColor.value,
                  {left: dark(row,col-1), right: dark(row,col+1), up: dark(row-1,col), down: dark(row+1,col)});
              }
            }
          }
          for (const [col, row] of [[0, 0], [count - 7, 0], [0, count - 7]]) {
            eye(ctx, offset + col * cell, offset + row * cell, cell, styles.frame, styles.center, qrColor.value, bgColor.value);
          }

          drawLogo(size);
          download.href = canvas.toDataURL("image/png");
          download.setAttribute("aria-disabled", "false");
          empty.hidden = true;
        } catch (error) {
          message.textContent = "สร้าง QR ไม่สำเร็จ: " + error.message;
        }
      }

      generateBtn.addEventListener("click", () => {
        generate();
        if (!valueInput.value.trim()) {
          message.textContent = "กรุณาใส่ URL หรือข้อความ";
          valueInput.focus();
        }
      });
      download.addEventListener("click", (event) => {
        if (download.getAttribute("aria-disabled") === "true") event.preventDefault();
      });
      logoInput.addEventListener("change", loadLogo);
      for (const input of [valueInput, qrColor, bgColor, sizeInput, useLogo]) {
        input.addEventListener("input", generate);
        input.addEventListener("change", generate);
      }

      generate();
    </script>
  </body>
</html>
